name: CI

on: [push]
jobs:
  sast_scan:
  name: run Bandit scan
  runs-on: ubuntu-latest

  steps:
  - name: Checkout Code
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with: 
      python-version: 3.8

  - name: install Bandit
    run: pip install bandit 

  - name: Run Bandit Scan
    run: bandit -r.
